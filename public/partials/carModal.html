<div id="carModal" class="modal hidden">
  <div class="modal-content">
    <button class="modal-close" id="carModalClose">✕</button>
    <h4 id="carModalTitle">Nuova Auto</h4>
    <!-- shared styles moved to public/index.html -->
    <form id="carModalForm">
      <div class="field"><label>Nome</label><input name="name" placeholder="Nome" required /></div>
      <div class="field"><label>Colore</label><div id="colorSwatches" class="swatches"></div><input type="hidden" name="color" /></div>
      <div class="field"><label>Categoria</label><select name="size">
        <option value="piccola">Piccola</option>
        <option value="media" selected>Media</option>
        <option value="grande">Grande</option>
        <option value="soccorso">Soccorso</option>
      </select></div>
      <div class="field"><label>Targa</label><input name="plate" placeholder="Targa" /></div>
      <div class="actions">
        <button type="submit" id="carSaveBtn" class="page-btn primary">Salva</button>
        <div class="spacer"></div>
        <button type="button" id="carDeleteBtn" class="page-btn danger">Elimina</button>
      </div>
    </form>
  </div>
</div>
