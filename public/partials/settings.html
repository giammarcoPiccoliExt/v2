<div id="settings" class="page">
  <h3>Impostazioni</h3>
    <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center">
      <button id="newCarBtn" class="page-btn"><span class="icon">＋</span><span>Nuova Auto</span></button>
      <button id="passcodesBtn" class="page-btn"><span class="icon">🔑</span><span>Passcode</span></button>
    </div>
  <div id="carsList"></div>

  <!-- container for modals -->
  <div id="modalsContainer"></div>
  
  <!-- Passcodes modal -->
  <div id="passcodesModal" class="modal" style="display:none">
    <div class="modal-content">
      <button class="modal-close" id="passcodesModalClose">✕</button>
      <h4>Passcode</h4>
      <div id="passcodesList" style="max-height:300px;overflow:auto;margin-bottom:8px"></div>
      <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
        <input id="newPassName" placeholder="Nome" style="flex:1;padding:6px" />
        <input id="newPassValue" placeholder="Codice" style="flex:1;padding:6px" />
        <button id="addPassBtn" class="page-btn">Aggiungi</button>
      </div>
      <div style="margin-top:12px"><button id="passcodesCloseBtn" class="page-btn">Chiudi</button></div>
    </div>
  </div>
</div>
