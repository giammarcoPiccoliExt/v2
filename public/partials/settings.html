<div id="settings" class="page">
  <h3>Impostazioni</h3>
    <div class="settings-toolbar">
      <button id="newCarBtn" class="page-btn"><span class="icon">＋</span><span>Nuova Auto</span></button>
      <button id="passcodesBtn" class="page-btn"><span class="icon">🔑</span><span>Passcode</span></button>
      <button id="checkInsuranceBtn" class="page-btn"><span class="icon">🛡️</span><span>Check Scadenza Assicurazione</span></button>
    </div>
  <div id="carsList"></div>

  <!-- container for modals -->
  <div id="modalsContainer"></div>
  
  <!-- Passcodes modal -->
  <div id="passcodesModal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" id="passcodesModalClose">✕</button>
      <h4>Passcode</h4>
      <div class="release-info">Versione prodotto: 1.3.0</div>
      <div id="passcodesList" class="passcodes-list"></div>
      <div class="passcodes-row">
        <input id="newPassName" placeholder="Nome" class="pass-input" />
        <input id="newPassValue" placeholder="Codice" class="pass-input" />
        <button id="addPassBtn" class="page-btn">Aggiungi</button>
      </div>
      
    </div>
  </div>
</div>
