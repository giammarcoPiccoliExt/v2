<div id="bookingModal" class="modal hidden">
  <div class="modal-content">
    <button class="modal-close" id="bookingModalClose">✕</button>
    <h4 id="bookingModalTitle">Nuova Prenotazione</h4>
    <div id="bookingModalClientName" class="field" style="font-size:16px;font-weight:700;display:none;margin-bottom:6px"></div>
    <!-- shared modal styles moved to public/index.html -->
    <form id="bookingModalForm">
      <div class="field"><label>Inizio</label><input type="date" name="start_date" required /></div>
      <div class="field"><label>Fine</label><input type="date" name="end_date" required /></div>
      <div class="field"><label>Auto</label><select name="car_id" required></select></div>
      <div id="overlapWarning" class="overlap-warning hidden"></div>
      <div class="field"><label>Nome cliente (opzionale)</label><input name="client_name" /></div>
      <div class="field"><label>Descrizione (opzionale)</label><input name="description" /></div>
      <div class="actions">
        <button type="submit" class="page-btn primary">Salva</button>
        <button type="button" id="bookingCancelBtn" class="page-btn">Annulla</button>
        <div class="spacer"></div>
      </div>
    </form>
  </div>
</div>
