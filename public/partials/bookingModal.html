<div id="bookingModal" class="modal hidden">
  <div class="modal-content">
    <button class="modal-close" id="bookingModalClose">✕</button>
    <h4 id="bookingModalTitle">Nuova Prenotazione</h4>
    <!-- shared modal styles moved to public/index.html -->
    <form id="bookingModalForm">
      <div class="field client-field">
        <input name="client_name" placeholder="Cliente" style="font-size:1.15em;font-weight:600;padding:8px 6px;width:100%;" />
      </div>
      <div class="field"><label>Inizio</label><input type="date" name="start_date" required /></div>
      <div class="field"><label>Fine</label><input type="date" name="end_date" required /></div>
      <div class="field"><label>Auto</label><select name="car_id" required></select></div>
      <div id="overlapWarning" class="overlap-warning hidden"></div>
      <div class="field"><label>Descrizione (opzionale)</label><input name="description" /></div>
      <div class="actions">
        <button type="submit" class="page-btn primary">Salva</button>
        <div class="spacer"></div>
      </div>
    </form>
  </div>
</div>

<!-- Edit overlay modal shown above the new-booking modal when needed -->
<div id="editOverlayModal" class="modal hidden" style="z-index:3000;">
  <div class="modal-content">
    <button class="modal-close" id="editOverlayClose">✕</button>
    <h4 id="editOverlayTitle">Cliente</h4>
    <form id="editOverlayForm">
      <div class="field client-field">
        <input name="client_name" placeholder="Cliente" style="font-size:1.15em;font-weight:600;padding:8px 6px;width:100%;" />
      </div>
      <div class="field"><label>Inizio</label><input type="date" name="start_date" required /></div>
      <div class="field"><label>Fine</label><input type="date" name="end_date" required /></div>
      <div class="field"><label>Auto</label><select name="car_id" required></select></div>
      <div class="actions">
        <button type="submit" class="page-btn primary" id="editOverlaySave">Salva</button>
        <button type="button" class="page-btn" id="editOverlayCancel">Annulla</button>
      </div>
    </form>
  </div>
</div>

  <!-- Change-resolve modal for adjusting the NEW booking to avoid conflicts -->
  <div id="changeResolveModal" class="modal hidden" style="z-index:3100;">
    <div class="modal-content">
      <button class="modal-close" id="changeResolveClose">✕</button>
      <h4 id="changeResolveTitle">Modifica prenotazione</h4>
      <!-- removed separate buttons: show controls directly -->
      <form id="changeResolveForm">
        <div id="changeResolveCar" class="field"><label>Auto</label><select name="car_id"></select></div>
        <div id="changeResolveDate" class="field" style="display:flex;gap:8px;align-items:center">
          <div style="flex:1"><label>Inizio</label><input type="date" name="start_date" /></div>
          <div style="flex:1"><label>Fine</label><input type="date" name="end_date" /></div>
        </div>
        <div class="actions" style="margin-top:8px">
          <button type="submit" class="page-btn primary">Salva</button>
          <button type="button" class="page-btn" id="changeResolveCancel">Annulla</button>
        </div>
      </form>
    </div>
  </div>
