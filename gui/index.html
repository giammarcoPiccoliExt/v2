<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Car Booking — GUI</title>
    <style>
      body{font-family:Segoe UI,Arial;background:#f7f7f7;margin:0;padding:16px}
      h1{font-size:18px;margin:0 0 12px}
      button{display:inline-block;padding:8px 12px;margin:6px;border-radius:6px;border:1px solid #bbb;background:#fff;cursor:pointer}
      #status{margin-top:12px;font-size:13px}
      #shortcutTarget{width:100%;margin-top:8px}
    </style>
  </head>
  <body>
    <div style="position:relative">
      <h1>Car Booking — GUI</h1>
      <div id="led" title="Stato" style="position:absolute;right:12px;top:12px;width:14px;height:14px;border-radius:50%;background:#c44;border:1px solid #900"></div>
    </div>
    <div>
      <button id="start">Avvia server</button>
      <button id="stop">Ferma server</button>
      <button id="open">Apri interfaccia</button>
    </div>
    <div style="margin-top:8px">
      <label style="font-size:12px;color:#444">Log:</label>
      <textarea id="logs" readonly style="width:100%;height:160px;margin-top:6px;background:#111;color:#0f0;padding:8px;border-radius:6px;border:1px solid #333;font-family:monospace;font-size:12px"></textarea>
    </div>
    <div id="status">Stato: inattivo</div>
    <script src="renderer.js"></script>
  </body>
</html>
